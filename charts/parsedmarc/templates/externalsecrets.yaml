{{- if .Values.externalSecrets.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.elasticsearch.secretName }}
  labels:
    {{- include "parsedmarc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.elasticsearch.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: ES_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.elasticsearch.properties.apiKey }}
    - secretKey: ES_HOST
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.elasticsearch.properties.host }}
    - secretKey: ES_PORT
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.elasticsearch.properties.port }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.gmail.secretName }}
  labels:
    {{- include "parsedmarc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.gmail.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.gmail.properties.credentialsJson }}
    - secretKey: delegated_user
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.gmail.properties.delegatedUser }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.kibana.secretName }}
  labels:
    {{- include "parsedmarc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.kibana.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: KIBANA_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.kibana.properties.url }}
    - secretKey: KIBANA_USER
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.kibana.properties.username }}
    - secretKey: KIBANA_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.kibana.properties.password }}
{{- end }}

