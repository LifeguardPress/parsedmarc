name: Build docker image

permissions:
  contents: read

on:
  release:
    types:
      - published
  push:
    branches:
      - master
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: gke-arc-runner-set-01
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_HOST: unix:///home/runner/var/run/docker.sock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags:  ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy parsedmarc with Skaffold
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: gke-arc-runner-set-01
    permissions:
      contents: read

    env:
      GCP_PROJECT_ID: prod-datacenter-489417
      GKE_CLUSTER: lgp-cluster-1
      GKE_LOCATION: us-central1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest
          install_components: gke-gcloud-auth-plugin

      - name: Configure GKE credentials
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud auth list
          gcloud container clusters get-credentials "$GKE_CLUSTER" \
            --region "$GKE_LOCATION" \
            --project "$GCP_PROJECT_ID"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install Skaffold
        run: |
          curl --fail --silent --show-error --location \
            -o "$RUNNER_TEMP/skaffold" \
            https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod 0755 "$RUNNER_TEMP/skaffold"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/skaffold" version

      - name: Deploy parsedmarc
        run: skaffold run --profile prod --status-check=true
